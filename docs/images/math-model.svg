<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#f7f8fb"/><text x="600" y="55" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700">Mathematical core</text><text x="600" y="105" text-anchor="middle" font-family="serif" font-size="27">X = xG</text><text x="600" y="160" text-anchor="middle" font-family="serif" font-size="27">ZA = zA G      ZB = zB G</text><text x="600" y="225" text-anchor="middle" font-family="serif" font-size="29" font-weight="700">s = x + zA + zB  (mod q)</text><path d="M600 250V300" stroke="#222" stroke-width="4"/><text x="600" y="350" text-anchor="middle" font-family="serif" font-size="29">sG = (x + zA + zB)G</text><text x="600" y="405" text-anchor="middle" font-family="serif" font-size="29">= X + ZA + ZB</text><rect x="240" y="435" width="720" height="52" rx="16" fill="#fff" stroke="#222" stroke-width="2"/><text x="600" y="469" text-anchor="middle" font-family="sans-serif" font-size="18">Every pre-issued note can define a different transaction public key</text></svg>