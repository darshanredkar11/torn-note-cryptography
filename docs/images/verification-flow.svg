<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="28" fill="#f7f7f5"/><text x="600" y="52" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700">What the verifier actually checks</text><g font-family="sans-serif" font-size="19" text-anchor="middle"><rect x="55" y="115" width="240" height="110" rx="18" fill="#fff" stroke="#222" stroke-width="3"/><text x="175" y="155" font-weight="700">1. NOTE</text><text x="175" y="190">Merkle membership</text><rect x="335" y="115" width="240" height="110" rx="18" fill="#fff" stroke="#222" stroke-width="3"/><text x="455" y="155" font-weight="700">2. MESSAGE</text><text x="455" y="190">exact transaction D</text><rect x="615" y="115" width="240" height="110" rx="18" fill="#fff" stroke="#222" stroke-width="3"/><text x="735" y="155" font-weight="700">3. SIGNATURES</text><text x="735" y="190">master + A + B</text><rect x="895" y="115" width="250" height="110" rx="18" fill="#fff" stroke="#222" stroke-width="3"/><text x="1020" y="155" font-weight="700">4. STATE</text><text x="1020" y="190">not already spent</text><path d="M295 170H330M575 170H610M855 170H890" stroke="#222" stroke-width="4"/><rect x="245" y="330" width="710" height="125" rx="22" fill="#fff" stroke="#222" stroke-width="3"/><text x="600" y="370" font-weight="700">ACCEPT ONLY IF ALL CONDITIONS HOLD</text><text x="600" y="410">membership + message + signatures + unspent</text><text x="600" y="438" font-weight="700">otherwise → REJECT</text></g></svg>