<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470"><rect width="1100" height="470" rx="28" fill="#faf8f2"/><text x="550" y="55" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700">From paper torn note to digital authorization</text><rect x="80" y="115" width="380" height="220" rx="18" fill="#fffdf7" stroke="#333" stroke-width="3"/><path d="M270 115L250 145L285 175L250 205L285 235L250 265L285 295L270 335" fill="none" stroke="#555" stroke-width="5"/><text x="170" y="175" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">HALF A</text><text x="370" y="175" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">HALF B</text><text x="270" y="370" text-anchor="middle" font-family="sans-serif" font-size="18">Only the matching original pieces form the note</text><path d="M480 225H610" stroke="#333" stroke-width="4"/><rect x="640" y="115" width="380" height="220" rx="18" fill="#fff" stroke="#333" stroke-width="3"/><text x="830" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">CRYPTOGRAPHIC NOTE</text><text x="830" y="205" text-anchor="middle" font-family="sans-serif" font-size="18">noteId + public A + public B</text><text x="830" y="245" text-anchor="middle" font-family="sans-serif" font-size="18">↓</text><text x="830" y="280" text-anchor="middle" font-family="sans-serif" font-size="18">Merkle commitment</text><text x="830" y="315" text-anchor="middle" font-family="sans-serif" font-size="18">cannot silently replace a half</text></svg>