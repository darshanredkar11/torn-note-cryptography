<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#f7f7f5"/><text x="600" y="58" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700">Torn Note Authorization</text><text x="600" y="94" text-anchor="middle" font-family="sans-serif" font-size="18">The permanent wallet key is necessary — but not sufficient</text><rect x="70" y="145" width="280" height="155" rx="22" fill="#fff" stroke="#222" stroke-width="3"/><text x="210" y="190" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">MASTER</text><text x="210" y="230" text-anchor="middle" font-family="sans-serif" font-size="17">long-lived wallet identity</text><text x="210" y="264" text-anchor="middle" font-family="sans-serif" font-size="17">X = xG</text><rect x="460" y="145" width="280" height="155" rx="22" fill="#fff" stroke="#222" stroke-width="3"/><text x="600" y="190" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">NOTE</text><text x="600" y="228" text-anchor="middle" font-family="sans-serif" font-size="17">Half A + Half B</text><text x="600" y="264" text-anchor="middle" font-family="sans-serif" font-size="17">pre-issued + committed</text><rect x="850" y="145" width="280" height="155" rx="22" fill="#fff" stroke="#222" stroke-width="3"/><text x="990" y="190" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">TRANSACTION</text><text x="990" y="230" text-anchor="middle" font-family="sans-serif" font-size="17">exact amount / claims / nonce</text><text x="990" y="264" text-anchor="middle" font-family="sans-serif" font-size="17">hashed into D</text><path d="M350 222H455M740 222H845" stroke="#222" stroke-width="4"/><rect x="180" y="385" width="840" height="150" rx="25" fill="#fff" stroke="#222" stroke-width="3"/><text x="600" y="430" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700">VERIFIER</text><text x="600" y="468" text-anchor="middle" font-family="sans-serif" font-size="18">Merkle membership + Master + A + B signatures</text><text x="600" y="505" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">ALL TRUE → ACCEPT</text></svg>